[package]
name = "mctier"
version = "2.8.0"
description = "MCTier - Minecraft 虚拟局域网联机工具"
authors = ["MCTier Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mctier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "stream", "json"] }
rfd = "0.15"
urlencoding = "2.1"
base64 = "0.22"
# 聊天鉴权：每个成员一对 P-256 密钥，消息由私钥签名、接收方用信令下发的
# 公钥验签。选 P-256 而非 Ed25519 是为了与 Android 端互通——Android 的
# `KeyPairGenerator("Ed25519")` 要 API 33+，而本项目 minSdk 为 26，
# secp256r1 + SHA256withECDSA 则在所有支持的系统版本上都可用。
p256 = "0.13"
sha2 = "0.10"
# 高性能文件传输
bytes = "1"
dashmap = "6"
parking_lot = "0.12"
# HTTP 文件服务器
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
async-stream = "0.3"
# ZIP 压缩
zip = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux 专用：WebKitGTK 的 MediaStream/WebRTC 开关默认关闭，且 wry 未处理
# permission-request 信号，必须直接操作底层 WebView 才能拿到麦克风/摄像头能力。
# 版本需与 tauri 2.x 依赖的 wry 所用 webkit2gtk 保持一致（2.x → webkit2gtk-4.1）。
[target.'cfg(target_os = "linux")'.dependencies]
# 特性与 tauri 自身对 webkit2gtk 的声明保持一致（v2_40 链式包含 v2_4）。
# 不能省：set_enable_media_stream / set_enable_mediasource 由 v2_4 门控，
# 若只依赖 cargo 的特性合并，将来 tauri 调整特性就会突然编译失败。
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.23"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Threading",
    "Win32_System_Performance",
] }

# 发布构建：剥离符号，避免二进制中残留调试信息与开发机绝对路径（见 issue #17 第 11 条）
[profile.release]
strip = true
[dev-dependencies]
proptest = "1"
tempfile = "3"
# 仅测试需要：tower 的 util 特性提供 ServiceExt::oneshot，用于直接驱动 axum Router 断言 CORS 响应头
tower = { version = "0.4", features = ["util"] }
