name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint / typecheck / test)
    runs-on: windows-latest
    steps:
      # Pin third-party actions to immutable commits; release tags are mutable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 需要 Node 22+：`node --test tests/*.test.mjs` 依赖 Node 自身的 glob 展开
          # （cmd.exe 不做展开），Node 20 会报 "Could not find 'tests\*.test.mjs'"。
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # 存量代码尚有大量 eslint 告警/错误（多为 no-console 与 explicit-any），
        # 先纳入 CI 保持可见性，暂不阻塞，待逐步清理后再改为强制。
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Audit runtime dependencies
        # 运行时依赖必须无高危漏洞；开发期依赖（vite / rollup 等）另行跟踪，
        # 不阻塞 CI，避免上游未修复时长期红灯。
        run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust (fmt / clippy / check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: Fetch third-party binaries
        # resource_manager.rs 通过 include_bytes! 内嵌第三方二进制，且这些文件不入库，
        # 因此编译前必须先获取并校验 SHA-256。
        run: .\scripts\fetch-binaries.ps1
        shell: pwsh

      - name: Stage compile-only EasyTier placeholders
        # easytier-core/cli 不再从官方发布包获取：官方构建在 PE 导入表中静态导入
        # Npcap 的 packet.dll，而 Npcap 不得随本项目再分发（见 THIRD_PARTY_NOTICES.md §8）。
        # 真实产物由 scripts/build-easytier-npcap-free.ps1 重建，但那需要克隆并完整编译
        # 一遍 EasyTier（数分钟以上），对每次 CI 而言过于昂贵。
        #
        # 本任务只验证「代码能否编译、单元测试是否通过」，全程不执行这两个二进制，
        # 因此放占位文件让 include_bytes! 有东西可读即可。占位内容刻意是可识别的文本：
        # 一旦被误用于发行构建，EasyTier 会立即以明显的方式失败，而不是悄悄产出坏包。
        run: |
          $dir = 'src-tauri/resources/binaries'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($name in @('easytier-core.exe', 'easytier-cli.exe')) {
            $path = Join-Path $dir $name
            if (Test-Path -LiteralPath $path) { continue }
            Set-Content -LiteralPath $path -Encoding ascii -NoNewline -Value 'MCTIER-CI-PLACEHOLDER-NOT-A-REAL-BINARY'
            Write-Host "staged placeholder: $name"
          }
        shell: pwsh

      - name: Format check
        working-directory: src-tauri
        # 存量文件（build.rs / lib.rs 等）尚未按 rustfmt 规范化，暂不阻塞。
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        # 存量代码有 72 项 clippy 告警，先保持可见性，暂不阻塞。
        continue-on-error: true
        run: cargo clippy --lib --tests

      - name: Check
        working-directory: src-tauri
        run: cargo check --lib --tests

      - name: Unit tests
        working-directory: src-tauri
        # `cargo check --tests` 只编译不执行；测试必须单独跑，否则断言回归不会被发现。
        run: cargo test --lib

  linux:
    name: Linux (deps / check / test / shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          key: linux

      - name: Install system dependencies
        # Tauri 2 在 Linux 上需要 WebKitGTK + GTK3；libcap2-bin 提供 setcap/getcap，
        # 运行期用来给 easytier 二进制授予 TUN 能力（应用本体不提权）。
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config libcap2-bin unzip

      - name: Fetch third-party binaries (Linux)
        # resource_manager.rs 在 Linux 上 include_bytes! 内嵌 EasyTier 的 Linux 二进制，
        # 这些文件不入库，编译前必须先获取并校验 SHA-256。
        run: ./MCTier-Linux/scripts/fetch-binaries.sh

      - name: Check
        working-directory: src-tauri
        # Linux 侧的 cfg 分支只有在 Linux 目标上才会被编译，Windows 任务覆盖不到，
        # 因此这一步是 Linux 代码唯一的真实编译验证。
        run: cargo check --lib --tests

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Clippy
        working-directory: src-tauri
        # 与 Windows 任务一致：存量告警先保持可见，暂不阻塞。
        continue-on-error: true
        run: cargo clippy --lib --tests

      - name: Shellcheck Linux scripts
        # 这些脚本会带 sudo/pkexec 执行，未加引号的变量展开可能造成实际危害，必须阻塞。
        run: |
          set -e
          sudo apt-get install -y shellcheck
          shellcheck MCTier-Linux/scripts/*.sh

      - name: Validate desktop entry and polkit policy
        run: |
          set -e
          sudo apt-get install -y desktop-file-utils libxml2-utils
          desktop-file-validate MCTier-Linux/packaging/mctier.desktop
          xmllint --noout MCTier-Linux/packaging/com.mctier.app.policy

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Assemble debug APK
        working-directory: MCTier-Android
        run: ./gradlew assembleDebug --no-daemon

  license-check:
    name: License compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify third-party notice files exist
        run: |
          set -e
          for f in LICENSE THIRD_PARTY_NOTICES.md LICENSE-LGPL-3.0.txt LICENSE-GPL-3.0.txt; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          for f in licenses/LICENSE-Apache-2.0.txt licenses/LICENSE-MIT.txt \
                   licenses/LICENSE-BSD-3-Clause.txt licenses/LICENSE-GPL-2.0.txt \
                   licenses/LICENSE-GPL-3.0.txt licenses/LICENSE-LGPL-3.0.txt \
                   licenses/LICENSE-Wintun.txt; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

      - name: Verify every bundled component is documented
        run: |
          set -e
          for name in EasyTier Wintun WinDivert LocalVQE GGML; do
            grep -q "$name" THIRD_PARTY_NOTICES.md || { echo "$name missing from THIRD_PARTY_NOTICES.md"; exit 1; }
          done

      - name: Verify the modified-EasyTier patches are present
        run: |
          set -e
          test -f patches/easytier-2.6.0-mctier-android.patch
          test -f patches/pnet_datalink-0.35.0-no-npcap.patch

      # Npcap is proprietary and must never be redistributed by this project.
      # These files were bundled before; assert they cannot creep back in.
      - name: Verify no Npcap file is bundled
        run: |
          set -e
          for f in Packet.dll Packet.lib; do
            test ! -e "src-tauri/resources/binaries/$f" || { echo "$f must not be bundled"; exit 1; }
          done
          ! grep -rn 'include_bytes!.*Packet\.dll' src-tauri/src || { echo "Packet.dll is still embedded"; exit 1; }

  cargo-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      - name: cargo audit
        working-directory: src-tauri
        # 不因未修复的上游告警阻塞主线，但保留可见性。
        continue-on-error: true
        run: cargo audit

      - name: cargo deny
        working-directory: src-tauri
        continue-on-error: true
        run: cargo deny check
