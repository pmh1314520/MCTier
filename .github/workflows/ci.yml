name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and regression tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build frontend and typecheck
        run: npm run build
      - name: Run regression tests
        run: npm test
      - name: Report lint debt
        continue-on-error: true
        run: npm run lint

  rust-source:
    name: Rust source checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: Check refactored Rust formatting
        working-directory: src-tauri
        run: rustfmt --edition 2021 --check src/command_registry.rs src/modules/app_core.rs src/modules/error.rs src/modules/logs.rs src/modules/tauri_commands/logging.rs
      - name: Check lockfile is present
        shell: pwsh
        run: if (-not (Test-Path src-tauri/Cargo.lock)) { throw 'Cargo.lock is required' }

  android-source:
    name: Android source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify Android project inputs
        shell: bash
        run: |
          set -eu
          test -f MCTier-Android/gradlew
          test -f MCTier-Android/gradle/wrapper/gradle-wrapper.properties
          test -f MCTier-Android/app/build.gradle.kts

  license:
    name: License and source inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify required notices
        shell: bash
        run: |
          set -eu
          for f in LICENSE THIRD_PARTY_NOTICES.md SECURITY.md; do test -f "$f"; done
          grep -q 'EasyTier' THIRD_PARTY_NOTICES.md
          grep -q 'Wintun' THIRD_PARTY_NOTICES.md

  cargo-audit:
    name: Dependency audit (advisory results are visible)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cargo audit and deny
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit Rust dependencies
        working-directory: src-tauri
        continue-on-error: true
        run: cargo audit
      - name: Check Rust dependency policy
        working-directory: src-tauri
        run: cargo deny check
