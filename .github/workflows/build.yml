name: Build

# 全平台自动编译：
#   - 任意 PR 提交/更新时触发全部矩阵
#   - push 到 master/main 时触发
#   - 推送 v* 标签时构建全部产物并汇总为草稿 Release
#   - 支持手动触发（workflow_dispatch）
# 产物不签名（签名仍按 docs 流程在本地/发布机执行）。
on:
  pull_request:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  windows:
    name: Windows x64 (NSIS installer)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # 镜像自带 LLVM（libclang.dll），bindgen 依赖需要
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install protoc
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: protoc
      - name: Fetch third-party driver binaries (wintun / WinDivert)
        run: .\scripts\fetch-binaries.ps1
      - name: Build Npcap-free EasyTier binaries
        run: .\scripts\build-easytier-npcap-free.ps1
      - name: Stage pinned sherpa-onnx archive
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | ConvertFrom-Json
          .\scripts\prepare-sherpa-windows.ps1 -CargoTargetDirectory $metadata.target_directory
      - name: Install frontend dependencies
        run: npm ci
      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/mctier.exe

  linux:
    name: Linux x64 (deb + AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file unzip pkg-config \
            libssl-dev libgtk-3-dev librsvg2-dev patchelf nasm \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libfuse2t64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Fetch EasyTier Linux binaries
        run: bash MCTier-Linux/scripts/fetch-binaries.sh
      - name: Build and bundle (deb + AppImage)
        # 脚本内含 npm ci、类型检查、前端/Rust 测试与 tauri build
        env:
          # CI 无 FUSE 时让 linuxdeploy/appimagetool 以解压模式运行
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash MCTier-Linux/scripts/build.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  macos:
    name: macOS ${{ matrix.arch }} (DMG)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: aarch64
          - os: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: MCTier-MacOS/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: MCTier-MacOS/src-tauri
      - name: Install build tools (cmake / protobuf)
        run: brew install cmake protobuf
      - name: Build DMG
        # 脚本内含 EasyTier 源码构建、npm ci、测试与 tauri build
        working-directory: MCTier-MacOS
        run: bash scripts/build.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: MCTier-MacOS/src-tauri/target/release/bundle/dmg/*.dmg

  android:
    name: Android arm64-v8a (APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: shared/image-optimizer
      - name: Install cargo-ndk
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      # Gradle 任务会调用仓库根目录的 node 脚本（esbuild / libarchive.js / 语音模型）
      - name: Install frontend build dependencies
        run: npm ci
      - name: Build APKs (debug + release)
        working-directory: MCTier-Android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - name: Collect artifacts
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist-android
          cp MCTier-Android/app/build/outputs/apk/debug/app-debug.apk \
            "dist-android/MCTier-${version}-android-arm64-v8a-debug.apk"
          cp MCTier-Android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "dist-android/MCTier-${version}-android-arm64-v8a-release-unsigned.apk"
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-arm64-v8a
          if-no-files-found: error
          path: dist-android/*.apk

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: (cd dist && sha256sum -- * > SHA256SUMS.txt)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag --generate-notes \
            --title "MCTier $GITHUB_REF_NAME" \
          || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
