name: Quality

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint / typecheck / test)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Pin third-party actions to immutable commits; release tags are mutable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 22+ is required by the native `node --test tests/*.test.mjs`
          # glob used by the package test script.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # The existing tree has a tracked lint backlog. Keep the report visible
        # without making every unrelated change unmergeable; new code should
        # reduce this baseline over time.
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  rust:
    name: Rust (fmt / check / test)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Stage compile-only external artifacts
        shell: pwsh
        run: |
          # The distributable EasyTier binaries are intentionally not checked in.
          # A release build must obtain and verify the real binaries with the
          # scripts documented in README.md. Quality checks only compile and run
          # unit tests, so recognizable placeholders are sufficient here.
          $dir = 'src-tauri/resources/binaries'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($name in @(
            'easytier-core.exe',
            'easytier-cli.exe',
            'wintun.dll',
            'WinDivert64.sys'
          )) {
            $path = Join-Path $dir $name
            if (Test-Path -LiteralPath $path) { continue }
            Set-Content -LiteralPath $path -Encoding ascii -NoNewline `
              -Value 'MCTIER-CI-PLACEHOLDER-NOT-A-REAL-BINARY'
            Write-Host "staged placeholder: $name"
          }

      - name: Prepare verified speech model
        # src-tauri/build.rs invokes this script as well. Running it explicitly
        # makes the network-backed, checksum-verified build input visible in CI.
        run: node scripts/prepare-speech-model.mjs

      - name: Format check
        working-directory: src-tauri
        # Existing application modules are not yet rustfmt-clean. Keep this
        # visible without blocking unrelated refactors until the baseline is
        # formatted incrementally.
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Compile library and tests
        working-directory: src-tauri
        run: cargo check --locked --lib --tests

      - name: Check refactored module formatting
        working-directory: src-tauri
        run: rustfmt --edition 2021 --check src/command_registry.rs src/modules/error.rs src/modules/logs.rs src/modules/tauri_commands/logging.rs

      - name: Run unit tests
        working-directory: src-tauri
        # This test executes the real EasyTier binary. It is intentionally
        # excluded here because quality CI stages placeholders; release
        # validation must run it after fetching the verified binaries.
        run: cargo test --locked --lib -- --skip test_private_mode_arguments_accepted_by_bundled_easytier
